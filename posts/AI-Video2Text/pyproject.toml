[project]
name = "video2notes"
version = "1.0.0"
description = "Extract Chinese subtitles and screenshots from video courses using OpenAI Whisper"
requires-python = ">=3.11"
dependencies = [
    "openai-whisper>=20250625",
    "opencv-python>=4.8.0",
    "imageio-ffmpeg>=0.5.0",
    "torch>=2.14.1,<2.15",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    "urllib3>=2.8.0",
]

[tool.uv]
# Security floors for indirect dependencies included in the downloadable example.
constraint-dependencies = [
    "certifi>=2026.10.23",
    "filelock>=4.2.11",
    "fsspec>=2026.9.0",
    "idna>=3.20",
    "setuptools>=84.2.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[project.scripts]
video2notes = "video2notes.cli:main"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
